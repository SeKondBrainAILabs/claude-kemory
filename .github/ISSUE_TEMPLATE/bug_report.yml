name: Bug report
description: Something in the plugin does not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Most plugin problems are setup problems, and `/kemory:status` names them
        directly. Please run it first and paste the output — it saves a round trip.
  - type: textarea
    id: status
    attributes:
      label: /kemory:status output
      description: Redact anything you would rather not publish. It prints no credentials.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version
      description: From `/plugin` or plugin.json.
      placeholder: "0.2.8"
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where you are running Claude Code
      options:
        - Terminal
        - Desktop app
        - IDE extension
        - Claude Code on the web
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
